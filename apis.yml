aid: wing-alphabet
name: Wing
description: >-
  Wing is Alphabet's drone delivery subsidiary, spun out of Google X in 2018,
  with operating headquarters in Palo Alto, California and significant
  operations in Australia, Finland, Ireland, and the United States. Wing
  designs, builds, and operates a fleet of small fixed-wing electric VTOL
  aircraft that autonomously pick up and deliver packages to customers'
  homes, and it operates an unmanned traffic management (UTM) stack used by
  drone pilots and aviation authorities. Wing was the first company to receive
  an FAA Part 135 Air Carrier Certificate for drone delivery (2019) and is an
  approved LAANC USS in the United States and an approved drone airspace
  authorization provider for CASA in Australia. Wing's commercial surface is
  split across two main platforms — the Wing Delivery Platform, a partner-only
  API and UI suite that lets retailers, restaurants, and logistics providers
  embed drone delivery into their own order flows (Walmart, DoorDash,
  Papa Johns, and others), and OpenSky, a consumer drone airspace
  authorization app and partner API. Wing also co-founded the InterUSS
  Platform open-source UTM project, now hosted by the Linux Foundation.
  Wing's revenue comes from per-delivery fees charged to merchant partners
  and from drone-as-a-service operations rather than from public developer
  APIs; the Delivery Platform API and OpenSky API are not openly published
  and there is no public OpenAPI, SDK, or developer portal at the time of
  profiling.
